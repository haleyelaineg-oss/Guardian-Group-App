[build.environment]
  # The Supabase project URL isn't a secret — it's already public in every
  # page's source via js/config.js. Only SUPABASE_SERVICE_ROLE_KEY is
  # sensitive, and it correctly never appears in any committed file.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[[redirects]]
  from = "/"
  to = "/workshops/"
  status = 302

[[redirects]]
  from = "/resources/loading-and-transport"
  to = "/resources/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://sandbox.web.squarecdn.com https://web.squarecdn.com https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://sandbox.web.squarecdn.com https://web.squarecdn.com; font-src 'self' https://fonts.gstatic.com https://cash-f.squarecdn.com https://square-fonts-production-f.squarecdn.com https://d1g145x70srn7h.cloudfront.net; frame-src https://*.squarecdn.com https://*.squareupsandbox.com; connect-src 'self' https://*.squarecdn.com https://*.squareupsandbox.com https://*.squareup.com https://*.supabase.co https://o160250.ingest.sentry.io https://cdn.jsdelivr.net; img-src 'self' data: https://*.squarecdn.com;"
