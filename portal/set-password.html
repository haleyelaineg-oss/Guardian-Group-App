<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Your Password — Guardian Group</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/survey.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/portal.css" />
</head>
<body class="admin-body">

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <img src="../assets/logo-color.png" alt="Guardian Group" class="login-logo-img" onerror="this.style.display='none'" />
        <div class="login-wordmark">GUARDIAN GROUP</div>
        <div class="login-sub">Set Your Password</div>
      </div>

      <div id="setPasswordLoading">
        <p class="portal-login-hint">Verifying your link...</p>
      </div>

      <form class="login-form" id="setPasswordForm" novalidate style="display:none">
        <div class="field-group full">
          <label class="field-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="field-input" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div class="field-group full">
          <label class="field-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="field-input" placeholder="Re-enter your password" required minlength="8" />
        </div>
        <div class="login-error" id="setPasswordError" style="display:none"></div>
        <button type="submit" class="btn btn-primary login-btn" id="setPasswordBtn">Set Password →</button>
      </form>

      <div id="setPasswordInvalid" style="display:none">
        <div class="login-error">This link has expired or has already been used.</div>
        <a class="portal-link-btn" href="/portal/index.html" style="display:block; text-align:center; margin-top:16px;">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/portal.js"></script>
</body>
</html>
