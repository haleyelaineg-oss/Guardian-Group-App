<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Guardian Group Client Portal</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/survey.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/portal.css" />
</head>
<body class="admin-body">

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <img src="../assets/logo-color.png" alt="Guardian Group" class="login-logo-img" onerror="this.style.display='none'" />
        <div class="login-wordmark">GUARDIAN GROUP</div>
        <div class="login-sub">Create Your Portal Account</div>
      </div>
      <form class="login-form" id="signupForm" novalidate>
        <div class="field-group full">
          <label class="field-label" for="signupCode">Client Code</label>
          <input type="text" id="signupCode" class="field-input" placeholder="e.g. AB12CD34" required autocapitalize="characters" />
        </div>
        <div class="field-group full">
          <label class="field-label" for="signupName">Full Name</label>
          <input type="text" id="signupName" class="field-input" placeholder="Jane Smith" required />
        </div>
        <div class="field-group full">
          <label class="field-label" for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="field-input" placeholder="you@example.com" required />
        </div>
        <div class="field-group full">
          <label class="field-label" for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="field-input" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div class="field-group full">
          <label class="field-label" for="signupConfirmPassword">Confirm Password</label>
          <input type="password" id="signupConfirmPassword" class="field-input" placeholder="Re-enter your password" required minlength="8" />
        </div>
        <div class="login-error" id="signupError" style="display:none"></div>
        <button type="submit" class="btn btn-primary login-btn" id="signupBtn">Create Account →</button>
        <a class="portal-link-btn" href="/portal/index.html" style="display:block; text-align:center;">Already have an account? Sign in</a>
      </form>
      <p class="portal-login-hint">Your Client Code is provided by Guardian Group when your company joins the client portal. Don't have one? Contact <a href="mailto:info@guardiangroupsls.com">info@guardiangroupsls.com</a>.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/portal.js"></script>
</body>
</html>
