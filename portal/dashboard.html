<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portal — Guardian Group</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/survey.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/portal.css" />
</head>
<body class="admin-body">

  <div class="dashboard" id="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="../assets/logo-white.png" alt="" class="sidebar-logo-img" onerror="this.style.display='none'" />
        <div>
          <div class="sidebar-brand">GUARDIAN GROUP</div>
          <div class="sidebar-tag">Training Portal</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="training-records">
          <span class="nav-icon">◫</span> Training Records
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="portal-user-tag" id="portalUserTag"></div>
        <button class="btn-signout" onclick="portalSignOut()">Sign Out</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dash-main">

      <div class="top-bar">
        <div class="top-bar-left">
          <span class="top-bar-label" id="welcomeLabel">Welcome</span>
        </div>
      </div>

      <!-- VIEW: ORGANIZATION TRAINING RECORDS -->
      <div class="view active" id="view-training-records">
        <div class="view-header">
          <h1 class="view-title">Training Records</h1>
          <p class="view-sub" id="trainingRecordsSub">Training history for your organization.</p>
        </div>
        <div class="portal-summary-grid" id="trainingSummary" aria-label="Training record summary"></div>
        <div class="portal-record-filters">
          <label class="field-group">
            <span class="field-label">Search records</span>
            <input class="field-input" id="trainingSearch" type="search" placeholder="Employee or training name" />
          </label>
          <label class="field-group">
            <span class="field-label">Status</span>
            <select class="field-input" id="trainingStatusFilter">
              <option value="">All statuses</option>
              <option value="registered">Registered</option>
              <option value="attended">Attended</option>
              <option value="completed">Completed</option>
              <option value="no_show">No show</option>
            </select>
          </label>
        </div>
        <div id="trainingRecordsContent" aria-live="polite">
          <p class="empty-hint">Loading...</p>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/portal.js"></script>
</body>
</html>
